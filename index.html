<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap');
*{box-sizing:border-box;}
:root{
  --bg:#0B2B26; --bg-2:#0F332C; --panel:#133830; --panel-2:#175243;
  --gold:#C9A15A; --gold-light:#E9CD8C; --cream:#F2EBDA; --cream-dim:#C9C0AC;

body{margin:0;font-family:'Tajawal',sans-serif;background:radial-gradient(ellipse at 50% -10%, var(--bg-2), var(--bg) 60%);color:var(--cream);overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;}

.detail-avatar{width:110px;height:110px;border-radius:50%;margin:0 auto 12px;object-fit:cover;border:3px solid var(--gold);background:#175243;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:40px;}

.detail-name{font-family:'Amiri',serif;font-size:22px;text-align:center;color:var(--gold-light);font-weight:700;}
.detail-meta{text-align:center;color:var(--cream-dim);font-size:13px;margin-top:4px;}
.detail-bio{margin-top:14px;font-size:14px;line-height:1.7;color:var(--cream);white-space:pre-wrap;}
.detail-rel{margin-top:14px;font-size:13px;color:var(--cream-dim);}
.nasab{font-family:'Amiri',serif;font-size:14.5px;color:var(--gold-light);line-height:1.8;margin-bottom:10px;}
.detail-rel b{color:var(--cream);}
.modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:center;flex-wrap:wrap;}
.photo-btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed rgba(201,161,90,0.5);border-radius:10px;padding:10px;cursor:pointer;color:var(--cream-dim);font-size:13px;}
.photo-preview{width:60px;height:60px;border-radius:50%;object-fit:cover;margin-left:8px;}
.err-toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--danger);color:#2a0f0d;padding:8px 16px;border-radius:8px;z-index:60;font-size:13px;}
.spin{display:inline-block;animation:spin 1s linear infinite;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@media (min-width: 720px){
  header{max-width:1100px;padding:24px 24px 16px;}
  h1{font-size:38px;}
  .sub{font-size:15px;}
  .ft-btn{padding:11px 24px;font-size:15px;}
  #canvasWrap{cursor:grab;}
  #canvasWrap:active{cursor:grabbing;}
  .ft-login-card{max-width:420px;padding:40px 34px;}
  .ft-login-card h2{font-size:28px;}
  .zoom button{width:44px;height:44px;font-size:18px;}
}
@media (min-width: 1100px){
  header{max-width:1300px;}
}

<body>
<div id="app"></div>

<script>
const DB_URL = "https://family-tree-9007d-default-rtdb.asia-southeast1.firebasedatabase.app";
const TREE_ID = new URLSearchParams(window.location.search).get("tree") || "";
const PATH_PREFIX = TREE_ID ? "trees/"+encodeURIComponent(TREE_ID)+"/" : "";
const REMEMBER_KEY = "ft_remember_"+(TREE_ID||"default");
function rememberSession(role, rawKeyB64){
  try { localStorage.setItem(REMEMBER_KEY, JSON.stringify({role, rawKeyB64})); } catch(_) {}
}
function forgetSession(){
  try { localStorage.removeItem(REMEMBER_KEY); } catch(_) {}
}
function loadRememberedSession(){
  try { const raw = localStorage.getItem(REMEMBER_KEY); return raw ? JSON.parse(raw) : null; } catch(_) { return null; }
}
const ROW_HEIGHT = 110, COL_WIDTH = 105, NODE_W = 90, NODE_H = 52;

// ---------- Firebase REST helpers ----------
async function fbGet(path){ const r = await fetch(DB_URL+"/"+path+".json"); if(!r.ok) throw new Error("fb GET "+r.status); return r.json(); }
async function fbSet(path,val){ const r = await fetch(DB_URL+"/"+path+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(val)}); if(!r.ok) throw new Error("fb PUT "+r.status); return r.json(); }
async function fbDelete(path){ const r = await fetch(DB_URL+"/"+path+".json",{method:"DELETE"}); if(!r.ok) throw new Error("fb DEL "+r.status); }

// ---------- Crypto helpers ----------
function bufToB64(buf){ const b=new Uint8Array(buf); let s=""; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function b64ToBuf(b64){ const s=atob(b64); const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return b.buffer; }
function randomSaltB64(){ return bufToB64(crypto.getRandomValues(new Uint8Array(16)).buffer); }
async function deriveKey(password, saltB64){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64ToBuf(saltB64), iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encryptText(key, text){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const c = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(text));
  return bufToB64(iv)+"."+bufToB64(c);
}
async function decryptText(key, combined){
  const [ivB64,dataB64] = combined.split(".");
  const iv = new Uint8Array(b64ToBuf(ivB64));
  const p = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, b64ToBuf(dataB64));
  return new TextDecoder().decode(p);
}
async function generateDataKeyRawB64(){
  const key = await crypto.subtle.generateKey({name:"AES-GCM", length:256}, true, ["encrypt","decrypt"]);
  return bufToB64(await crypto.subtle.exportKey("raw", key));
}
async function importDataKey(rawB64){
  return crypto.subtle.importKey("raw", b64ToBuf(rawB64), {name:"AES-GCM"}, false, ["encrypt","decrypt"]);
}
async function wrapDataKeyFor(secret, rawDataKeyB64){
  const salt = randomSaltB64();
  const key = await deriveKey(secret, salt);
  const wrap = await encryptText(key, rawDataKeyB64);
  return {salt, wrap};
}
function generateRecoveryCode(){
  const b = crypto.getRandomValues(new Uint8Array(15));
  const hex = Array.from(b).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();
  return hex.match(/.{1,4}/g).join("-");
}
function genLabel(n){ return n===1 ? "الجيل الأول — الجد الأكبر" : "الجيل "+n; }
function uid(){ return "p_"+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function elbowPath(x1,y1,x2,y2,r){
  if (Math.abs(x1-x2) < 1) return "M "+x1+" "+y1+" L "+x2+" "+y2;
  const midY=(y1+y2)/2, dir=x2>x1?1:-1;
  const rr = Math.max(0, Math.min(r, Math.abs(x2-x1)/2, Math.abs(midY-y1), Math.abs(y2-midY)));
  return "M "+x1+" "+y1+" L "+x1+" "+(midY-rr)+" Q "+x1+" "+midY+" "+(x1+rr*dir)+" "+midY+" L "+(x2-rr*dir)+" "+midY+" Q "+x2+" "+midY+" "+x2+" "+(midY+rr)+" L "+x2+" "+y2;
}
async function compressImage(file, maxSize=220, quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let {width,height} = img;
        if (width>height){ if(width>maxSize){height*=maxSize/width; width=maxSize;} }
        else { if(height>maxSize){width*=maxSize/height; height=maxSize;} }
        const c = document.createElement("canvas"); c.width=width; c.height=height;
        c.getContext("2d").drawImage(img,0,0,width,height);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- App state ----------
const state = {
  mode: "checking", // checking|unsupported|setup|setup-recovery|login|forgot|forgot-newpass|app
  session: null, // {role, cryptoKey}
  people: {},
  search: "",
  highlightGen: null,
  zoom: 1,
  detailId: null,
  editId: null,
  confirmDeleteId: null,
  err: "",
  busy: false,
  pendingDataKeyB64: null,
  recoveryCode: "",
  savedConfirmed: false,
  syncing: false,
  lastFitKey: null,
  showStats: false,
  showChangePw: false,
  familyName: "",
  showFamilyName: false,
};

const app = document.getElementById("app");
let pollTimer = null;
let gestureActive = false; // true while the user is actively dragging/pinching the tree
let globalMouseDrag = {active:false, lastX:0, lastY:0, wrap:null};
window.addEventListener("mousemove", e => {
  if (!globalMouseDrag.active || !globalMouseDrag.wrap) return;
  globalMouseDrag.wrap.scrollLeft -= (e.clientX-globalMouseDrag.lastX);
  globalMouseDrag.wrap.scrollTop -= (e.clientY-globalMouseDrag.lastY);
  globalMouseDrag.lastX = e.clientX; globalMouseDrag.lastY = e.clientY;
});
window.addEventListener("mouseup", () => {
  if (globalMouseDrag.wrap) globalMouseDrag.wrap.style.cursor = "grab";
  globalMouseDrag.active = false;
  gestureActive = false;
});

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// ---------- Layout ----------
function computeLayout(people){
  const list = Object.values(people);
  const childrenMap = {};
  list.forEach(p=>{ if(p.parentId && people[p.parentId]) (childrenMap[p.parentId]=childrenMap[p.parentId]||[]).push(p.id); });
  const roots = list.filter(p=>!p.parentId || !people[p.parentId]).map(p=>p.id);
  roots.sort((a,b)=>(people[a].createdAt||0)-(people[b].createdAt||0));
  Object.values(childrenMap).forEach(arr=>arr.sort((a,b)=>(people[a].createdAt||0)-(people[b].createdAt||0)));

  // Siblings (same parent) are packed close together; different branches get a bit more air.
  const xPos = {}; let cursor = 0; let lastParentId = undefined; const visited = new Set();
  function assignX(id, parentId){
    if (visited.has(id)) return xPos[id];
    visited.add(id);
    const kids = childrenMap[id]||[];
    if (kids.length===0){
      if (lastParentId !== undefined) cursor += (parentId===lastParentId ? 0.95 : 1.3);
      xPos[id]=cursor; lastParentId = parentId;
    }
    else { kids.forEach(k=>assignX(k,id)); const xs=kids.map(k=>xPos[k]); xPos[id]=(Math.min(...xs)+Math.max(...xs))/2; }
    return xPos[id];
  }
  roots.forEach(id=>assignX(id, null));
  list.forEach(p=>{ if(!visited.has(p.id)) assignX(p.id, p.parentId||null); });

  const maxGen = Math.max(1, ...list.map(p=>p.gen||1));
  const positions = {};
  list.forEach(p=>{ const g=Math.max(p.gen||1,1); positions[p.id] = {x: xPos[p.id]??0, row: g-1, gen: g}; });
  const width = (cursor+2)*COL_WIDTH + 220;
  const height = maxGen*ROW_HEIGHT + 140;
  const genRowStart = {}; for (let g=1; g<=maxGen; g++) genRowStart[g] = g-1;
  return {positions, width, height, maxGen, genRowStart};
}
const pxX = x => 80 + x*COL_WIDTH;
const pxY = row => 60 + row*ROW_HEIGHT;
function scrollToPerson(id){
  requestAnimationFrame(() => {
    const wrap = document.getElementById("canvasWrap");
    const node = wrap && document.querySelector('.node[data-id="'+id+'"]');
    if (!wrap || !node) return;
    const zoom = state.zoom || 1;
    const targetLeft = (node.offsetLeft + node.offsetWidth/2) * zoom - wrap.clientWidth/2;
    const targetTop = (node.offsetTop + node.offsetHeight/2) * zoom - wrap.clientHeight/2;
    wrap.scrollLeft = Math.max(0, targetLeft);
    wrap.scrollTop = Math.max(0, targetTop);
  });
}

// ---------- Cloud sync ----------
async function loadAuthRecord(){
  try { return await fbGet(PATH_PREFIX+"auth"); } catch(_) { return null; }
}
async function saveAuthRecord(rec){ await fbSet(PATH_PREFIX+"auth", rec); }
async function loadMeta(){
  try { const m = await fbGet(PATH_PREFIX+"meta"); return m || {}; } catch(_) { return {}; }
}
async function saveMeta(meta){ await fbSet(PATH_PREFIX+"meta", meta); }

async function loadPeople(){
  try {
    const [data, meta] = await Promise.all([fbGet(PATH_PREFIX+"persons"), loadMeta()]);
    const loaded = {};
    if (data){
      for (const cipher of Object.values(data)){
        try {
          const plain = await decryptText(state.session.cryptoKey, cipher);
          const p = JSON.parse(plain);
          if (!Array.isArray(p.photos)) p.photos = p.photo ? [p.photo] : [];
          loaded[p.id] = p;
        } catch(_) {}
      }
    }
    state.people = loaded;
    if (meta.familyNameEnc){
      try { state.familyName = await decryptText(state.session.cryptoKey, meta.familyNameEnc); }
      catch(_) { state.familyName = ""; }
    } else {
      state.familyName = meta.familyName || "";
    }
    if (state.familyName) document.title = "شجرة عائلة "+state.familyName;
    render();
  } catch(e){
    state.err = "تعذّر تحميل البيانات.";
    render();
  }
}
async function savePersonCloud(person){
  state.people[person.id] = person;
  render();
  state.syncing = true; render();
  try {
    const cipher = await encryptText(state.session.cryptoKey, JSON.stringify(person));
    await fbSet(PATH_PREFIX+"persons/"+person.id, cipher);
  } catch(e){ state.err = "تعذّر الحفظ في السحابة."; }
  state.syncing = false; render();
}
async function deletePersonCloud(id){
  delete state.people[id];
  Object.values(state.people).forEach(p=>{
    if (p.parentId===id) p.parentId=null;
  });
  state.confirmDeleteId = null; state.detailId = null;
  render();
  state.syncing = true; render();
  try { await fbDelete(PATH_PREFIX+"persons/"+id); } catch(e){ state.err = "تعذّر الحذف من السحابة."; }
  state.syncing = false; render();
}

// ---------- Render ----------
function render(){
  if (state.mode === "app") { renderApp(); return; }
  renderLogin();
}

function renderLogin(){
  let html = '<div class="ft-login-wrap"><div class="ft-login-card">';
  const treeTag = TREE_ID ? '<div style="font-size:12px;color:var(--gold);margin-bottom:10px;">🌳 الشجرة: '+esc(TREE_ID)+'</div>' : '';
  html += treeTag;
  const loginTitle = state.familyName ? 'شجرة عائلة '+esc(state.familyName) : 'شجرة العائلة';
  if (state.mode === "checking"){
    html += '<div class="spin" style="font-size:24px;">⏳</div>';
  } else if (state.mode === "unsupported"){
    html += '<h2>المتصفح لا يدعم التشفير</h2><p>افتح هذه الصفحة في متصفح حديث (Safari أو Chrome).</p>';
  } else if (state.mode === "setup-recovery"){
    html += '<h2>احفظ رمز الاسترداد الآن</h2><p>الطريقة الوحيدة لاستعادة الوصول إذا نُسيت كل كلمات المرور. لن يُعرض مرة أخرى.</p>'
      + '<div class="ft-recovery-code">'+esc(state.recoveryCode)+'</div>'
      + '<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--cream-dim);margin:16px 0;text-align:right;">'

function field(id,label,type,placeholder,value){

      + '<input type="password" id="'+id+'" '+(placeholder?'placeholder="'+placeholder+'"':'')+(value?' value="'+esc(value)+'"':'')+' autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="padding-left:38px;">'
      + '<button type="button" class="pw-toggle" data-target="'+id+'" style="position:absolute;left:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--cream-dim);cursor:pointer;font-size:16px;padding:4px;">👁️</button>'

function errBlock(){ return state.err ? '<div class="ft-err">'+esc(state.err)+'</div>' : ''; }

function wireLoginEvents(){
  const savedChk = document.getElementById("savedChk");
  if (savedChk) savedChk.onchange = e => { state.savedConfirmed = e.target.checked; render(); };
  const finishBtn = document.getElementById("finishSetupBtn");
  if (finishBtn) finishBtn.onclick = async () => {
    const cryptoKey = await importDataKey(state.pendingDataKeyB64);
    state.session = {role:"admin", cryptoKey, rawKeyB64: state.pendingDataKeyB64};
      rememberSession("admin", state.pendingDataKeyB64);
    state.mode = "app";
    render();
    await loadPeople();
    startPolling();
  };
  function validateThreeTier(){
    const adminPw=val("adminPw"), adminPw2=val("adminPw2"), editPw=val("editPw"), editPw2=val("editPw2"), viewPw=val("viewPw"), viewPw2=val("viewPw2");
    if (adminPw.length<6) return "كلمة مرور المسؤول 6 أحرف على الأقل.";
    if (adminPw!==adminPw2) return "كلمتا مرور المسؤول غير متطابقتين.";
    if (editPw.length<6) return "كلمة مرور التعديل 6 أحرف على الأقل.";
    if (editPw!==editPw2) return "كلمتا مرور التعديل غير متطابقتين.";
    if (viewPw.length<6) return "كلمة مرور المشاهدة 6 أحرف على الأقل.";
    if (viewPw!==viewPw2) return "كلمتا مرور المشاهدة غير متطابقتين.";
    const set = new Set([adminPw,editPw,viewPw]);
    if (set.size < 3) return "اجعل الكلمات الثلاث مختلفة عن بعضها.";
    return null;
  }
  const setupBtn = document.getElementById("setupBtn");
  if (setupBtn) setupBtn.onclick = async () => {
    state.err = "";
    const errMsg = validateThreeTier();
    if (errMsg){ state.err = errMsg; render(); return; }
    const adminPw=val("adminPw"), editPw=val("editPw"), viewPw=val("viewPw");
    state.busy = true; render();
    try {
      const rawKey = await generateDataKeyRawB64();
      const adminWrap = await wrapDataKeyFor(adminPw, rawKey);
      const editWrap = await wrapDataKeyFor(editPw, rawKey);
      const viewWrap = await wrapDataKeyFor(viewPw, rawKey);
      const code = generateRecoveryCode();
      const recWrap = await wrapDataKeyFor(code, rawKey);
      await saveAuthRecord({
        adminSalt:adminWrap.salt, adminWrap:adminWrap.wrap,
        editSalt:editWrap.salt, editWrap:editWrap.wrap,
        viewSalt:viewWrap.salt, viewWrap:viewWrap.wrap,
        recSalt:recWrap.salt, recWrap:recWrap.wrap,
      });
      state.recoveryCode = code;
      state.pendingDataKeyB64 = rawKey;
      state.mode = "setup-recovery";
    } catch(e){ state.err = "تعذّر الإعداد: "+(e.message||e); }
    state.busy = false; render();
  };
  const loginBtn = document.getElementById("loginBtn");
  if (loginBtn) loginBtn.onclick = async () => {
    const pw = val("loginPw");
    state.err = ""; state.busy = true; render();
    try {
      const rec = await loadAuthRecord();
      let role = null, cryptoKey = null, rawKeyB64 = null;
      try {
        const k = await deriveKey(pw, rec.adminSalt);
        const raw = await decryptText(k, rec.adminWrap);
        cryptoKey = await importDataKey(raw); role = "admin"; rawKeyB64 = raw;
      } catch(_) {}
      if (!role){
        try {
          const k = await deriveKey(pw, rec.editSalt);
          const raw = await decryptText(k, rec.editWrap);
          cryptoKey = await importDataKey(raw); role = "editor"; rawKeyB64 = raw;
        } catch(_) {}
      }
      if (!role){
        const k = await deriveKey(pw, rec.viewSalt);
        const raw = await decryptText(k, rec.viewWrap);
        cryptoKey = await importDataKey(raw); role = "viewer"; rawKeyB64 = raw;
      }
      state.session = {role, cryptoKey, rawKeyB64};
      rememberSession(role, rawKeyB64);
      state.mode = "app";
      render();
      await loadPeople();
      startPolling();
    } catch(e){ state.err = "كلمة المرور غير صحيحة."; }
    state.busy = false; render();
  };
  const forgotBtn = document.getElementById("forgotBtn");
  if (forgotBtn) forgotBtn.onclick = () => { state.mode="forgot"; state.err=""; render(); };
  const backBtn = document.getElementById("backToLoginBtn");
  if (backBtn) backBtn.onclick = () => { state.mode="login"; state.err=""; render(); };
  const recoverBtn = document.getElementById("recoverBtn");
  if (recoverBtn) recoverBtn.onclick = async () => {
    const code = val("recInput").trim().toUpperCase();
    state.err = ""; state.busy = true; render();
    try {
      const rec = await loadAuthRecord();
      const k = await deriveKey(code, rec.recSalt);
      const raw = await decryptText(k, rec.recWrap);
      state.pendingDataKeyB64 = raw;
      state.mode = "forgot-newpass";
    } catch(e){ state.err = "رمز الاسترداد غير صحيح."; }
    state.busy = false; render();
  };
  const newPassBtn = document.getElementById("newPassBtn");
  if (newPassBtn) newPassBtn.onclick = async () => {
    state.err = "";
    const errMsg = validateThreeTier();
    if (errMsg){ state.err = errMsg; render(); return; }
    const adminPw=val("adminPw"), editPw=val("editPw"), viewPw=val("viewPw");
    state.busy = true; render();
    try {
      const rec = await loadAuthRecord();
      const adminWrap = await wrapDataKeyFor(adminPw, state.pendingDataKeyB64);
      const editWrap = await wrapDataKeyFor(editPw, state.pendingDataKeyB64);
      const viewWrap = await wrapDataKeyFor(viewPw, state.pendingDataKeyB64);
      await saveAuthRecord({
        ...rec,
        adminSalt:adminWrap.salt, adminWrap:adminWrap.wrap,
        editSalt:editWrap.salt, editWrap:editWrap.wrap,
        viewSalt:viewWrap.salt, viewWrap:viewWrap.wrap,
      });
      const cryptoKey = await importDataKey(state.pendingDataKeyB64);
      state.session = {role:"admin", cryptoKey, rawKeyB64: state.pendingDataKeyB64};
      rememberSession("admin", state.pendingDataKeyB64);
      state.mode = "app";
      render();
      await loadPeople();
      startPolling();
    } catch(e){ state.err = "تعذّر الحفظ."; }
    state.busy = false; render();
  };
  wirePasswordToggles();
}
function wirePasswordToggles(){
  document.querySelectorAll(".pw-toggle").forEach(btn => btn.onclick = () => {
    const input = document.getElementById(btn.dataset.target);
    if (!input) return;
    if (input.type === "password"){ input.type = "text"; btn.textContent = "🙈"; }
    else { input.type = "password"; btn.textContent = "👁️"; }
  });
}
function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ""; }

function startPolling(){
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => {
    if (state.mode==="app" && state.session && !state.editId && !state.showChangePw && !state.showFamilyName && !gestureActive) loadPeople();
  }, 7000);
}

    Object.values(state.people).forEach(p=>{

  const motherName = p.motherName || "";
  const husbandName = p.husbandName || "";
  const wifeName = p.wifeName || "";

  { let cur = p, guard = 0, parts = [esc(p.name)];

function computeStats(){
  const list = Object.values(state.people);
  const total = list.length;
  const males = list.filter(p=>p.gender==='m').length;
  const females = list.filter(p=>p.gender==='f').length;
  const deceased = list.filter(p=>p.deathYear && String(p.deathYear).trim()).length;
  const alive = total - deceased;
  const byGen = {};
  list.forEach(p=>{ const g = Math.max(p.gen||1,1); byGen[g] = (byGen[g]||0)+1; });
  const genRows = Object.keys(byGen).map(Number).sort((a,b)=>a-b).map(g=>({gen:g,count:byGen[g]}));
  const nameCounts = {};
  list.forEach(p=>{
    const first = (p.name||"").trim().split(/\s+/)[0];
    if (first) nameCounts[first] = (nameCounts[first]||0)+1;
  });
  const topNames = Object.entries(nameCounts).sort((a,b)=>b[1]-a[1]).slice(0,10);
  return {total, males, females, deceased, alive, genRows, topNames};
}

      + '</div>';

    html += '<div style="font-weight:700;color:var(--gold-light);margin:14px 0 8px;font-size:14px;">عدد الأفراد في كل جيل</div>';
    html += '<div style="font-size:13px;">';
    s.genRows.forEach(r => {
      const pct = Math.round((r.count/s.total)*100);
      html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">'
        + '<div style="width:90px;flex-shrink:0;color:var(--cream-dim);">'+esc(genLabel(r.gen))+'</div>'

        + '<div style="width:28px;text-align:left;">'+r.count+'</div></div>';
    });
    html += '</div>';

    if (s.topNames.length){
      html += '<div style="font-weight:700;color:var(--gold-light);margin:18px 0 8px;font-size:14px;">الأسماء الأكثر تكراراً</div>';
      html += '<div style="display:flex;flex-wrap:wrap;gap:6px;">';
      s.topNames.forEach(([name,count]) => {
        html += '<div style="background:var(--panel-2);border:1px solid rgba(201,161,90,0.3);border-radius:999px;padding:4px 12px;font-size:12.5px;">'
          + esc(name)+' <b style="color:var(--gold-light);">'+count+'</b></div>';
      });
      html += '</div>';
    }
  }
  html += '</div></div>';
  return html;
}

function wireAppEvents(layout){
  // Fix iOS Safari bug: RTL text inputs don't auto-scroll to keep the caret visible while typing.
  document.querySelectorAll('.ft-field input[dir="rtl"], .ft-field textarea[dir="rtl"], .search input[dir="rtl"]').forEach(el => {
    el.addEventListener('input', () => {
      requestAnimationFrame(() => { el.scrollLeft = -el.scrollWidth; });
    });
  });
  const searchInput = document.getElementById("searchInput");
  if (searchInput) searchInput.oninput = e => {
    const cursorPos = e.target.selectionStart;
    state.search = e.target.value;
    state.highlightGen = null;
    renderApp();
    const newInput = document.getElementById("searchInput");
    if (newInput) { newInput.focus(); newInput.setSelectionRange(cursorPos, cursorPos); }
    const term = state.search.trim();
    if (term){
      const searchLayout = computeLayout(state.people);
      const matches = Object.values(state.people).filter(p => p.name && p.name.includes(term));
      if (matches.length){
        matches.sort((a,b) => (searchLayout.positions[a.id]?.gen||1) - (searchLayout.positions[b.id]?.gen||1));
        scrollToPerson(matches[0].id);
      }
    }
  };
  document.getElementById("logoutBtn").onclick = () => { if(pollTimer) clearInterval(pollTimer); forgetSession(); state.session=null; state.mode="login"; state.people={}; render(); };
  document.getElementById("syncNowBtn").onclick = () => loadPeople();
  document.querySelectorAll(".legend button").forEach(b => b.onclick = () => {
    const g = parseInt(b.dataset.gen);
    state.search = "";
    state.highlightGen = g;
    renderApp();
    document.getElementById("canvasWrap").scrollTo({left:0, top: pxY(layout.genRowStart[g])*state.zoom-100, behavior:"smooth"});
  });
  const showStatsBtn = document.getElementById("showStatsBtn");
  if (showStatsBtn) showStatsBtn.onclick = () => { state.showStats = true; render(); };
  const statsOverlay = document.getElementById("statsOverlay");
  if (statsOverlay){
    statsOverlay.onclick = () => { state.showStats=false; render(); };
    document.getElementById("closeStatsBtn").onclick = () => { state.showStats=false; render(); };
  }

  const editFamilyNameBtn = document.getElementById("editFamilyNameBtn");
  if (editFamilyNameBtn) editFamilyNameBtn.onclick = () => { state.showFamilyName = true; state.err=""; render(); };
  const familyNameOverlay = document.getElementById("familyNameOverlay");
  if (familyNameOverlay){
    familyNameOverlay.onclick = () => { state.showFamilyName=false; state.err=""; render(); };
    document.getElementById("closeFamilyNameBtn").onclick = () => { state.showFamilyName=false; state.err=""; render(); };
    document.getElementById("saveFamilyNameBtn").onclick = async () => {
      const name = val("familyNameInput").trim();
      state.err = ""; state.busy = true; render();
      try {
        const meta = await loadMeta();
        const familyNameEnc = await encryptText(state.session.cryptoKey, name);
        const cleanMeta = {...meta}; delete cleanMeta.familyName;
        await saveMeta({...cleanMeta, familyNameEnc});
        state.familyName = name;
        if (name) document.title = "شجرة عائلة "+name;
        state.showFamilyName = false;
      } catch(e){ state.err = "تعذّر حفظ اسم العائلة."; }
      state.busy = false; render();
    };
  }

  const changePwBtn = document.getElementById("changePwBtn");
  if (changePwBtn) changePwBtn.onclick = () => { state.showChangePw = true; state.err=""; render(); };
  const changePwOverlay = document.getElementById("changePwOverlay");
  if (changePwOverlay){
    changePwOverlay.onclick = () => { state.showChangePw=false; state.err=""; render(); };
    document.getElementById("closeChangePwBtn").onclick = () => { state.showChangePw=false; state.err=""; render(); };
    document.getElementById("saveChangePwBtn").onclick = async () => {
      state.err = "";
      const adminPw=val("cpAdminPw"), adminPw2=val("cpAdminPw2"), editPw=val("cpEditPw"), editPw2=val("cpEditPw2"), viewPw=val("cpViewPw"), viewPw2=val("cpViewPw2");
      if (adminPw.length<6){ state.err="كلمة مرور المسؤول 6 أحرف على الأقل."; render(); return; }
      if (adminPw!==adminPw2){ state.err="كلمتا مرور المسؤول غير متطابقتين."; render(); return; }
      if (editPw.length<6){ state.err="كلمة مرور التعديل 6 أحرف على الأقل."; render(); return; }
      if (editPw!==editPw2){ state.err="كلمتا مرور التعديل غير متطابقتين."; render(); return; }
      if (viewPw.length<6){ state.err="كلمة مرور المشاهدة 6 أحرف على الأقل."; render(); return; }
      if (viewPw!==viewPw2){ state.err="كلمتا مرور المشاهدة غير متطابقتين."; render(); return; }
      const set = new Set([adminPw,editPw,viewPw]);
      if (set.size < 3){ state.err="اجعل الكلمات الثلاث مختلفة عن بعضها."; render(); return; }
      state.busy = true; render();
      try {
        const rec = await loadAuthRecord();
        const adminWrap = await wrapDataKeyFor(adminPw, state.session.rawKeyB64);
        const editWrap = await wrapDataKeyFor(editPw, state.session.rawKeyB64);
        const viewWrap = await wrapDataKeyFor(viewPw, state.session.rawKeyB64);
        await saveAuthRecord({
          ...rec,
          adminSalt:adminWrap.salt, adminWrap:adminWrap.wrap,
          editSalt:editWrap.salt, editWrap:editWrap.wrap,
          viewSalt:viewWrap.salt, viewWrap:viewWrap.wrap,
        });
        state.showChangePw = false;
        state.err = "";
      } catch(e){ state.err = "تعذّر حفظ كلمات المرور الجديدة."; }
      state.busy = false; render();
    };
  }

  const addBtn = document.getElementById("addPersonBtn");
  if (addBtn) addBtn.onclick = () => { state.editId="new"; state._editForm=null; render(); };
  const addFirstBtn = document.getElementById("addFirstBtn");
  if (addFirstBtn) addFirstBtn.onclick = () => { state.editId="new"; state._editForm=null; render(); };
  const zi = document.getElementById("zoomInBtn"); if (zi) zi.onclick = () => { state.zoom=Math.min(1.6,state.zoom+0.1); renderApp(); };
  const zo = document.getElementById("zoomOutBtn"); if (zo) zo.onclick = () => { state.zoom=Math.max(0.08,state.zoom-0.1); renderApp(); };

  document.querySelectorAll(".node").forEach(n => n.onclick = () => { state.detailId = n.dataset.id; render(); });

  const detailOverlay = document.getElementById("detailOverlay");
  if (detailOverlay){
    detailOverlay.onclick = () => { state.detailId=null; render(); };
    document.getElementById("closeDetailBtn").onclick = () => { state.detailId=null; render(); };
    const addChildBtn = document.getElementById("addChildBtn");
    if (addChildBtn) addChildBtn.onclick = () => { state.editId = "new-child-"+addChildBtn.dataset.id; state._editForm=null; render(); };
    const editBtn = document.getElementById("editPersonBtn");
    if (editBtn) editBtn.onclick = () => { state.editId = editBtn.dataset.id; state._editForm=null; render(); };
    const delBtn = document.getElementById("deletePersonBtn");
    if (delBtn) delBtn.onclick = () => { state.confirmDeleteId = delBtn.dataset.id; render(); };
    document.querySelectorAll(".gallery-thumb").forEach(t => t.onclick = (e) => {
      e.stopPropagation();
      const avatar = document.querySelector(".detail-avatar");
      if (avatar) avatar.innerHTML = '<img src="'+t.src+'">';
    });
  }

  const confirmOverlay = document.getElementById("confirmDeleteOverlay");
  if (confirmOverlay){
    confirmOverlay.onclick = () => { state.confirmDeleteId=null; render(); };
    document.getElementById("confirmDeleteYes").onclick = () => deletePersonCloud(state.confirmDeleteId);
    document.getElementById("confirmDeleteNo").onclick = () => { state.confirmDeleteId=null; render(); };
  }

  const editOverlay = document.getElementById("editOverlay");
  if (editOverlay){
    editOverlay.onclick = () => { state.editId=null; state.err=""; render(); };
    document.getElementById("closeEditBtn").onclick = () => { state.editId=null; state.err=""; render(); };
    document.getElementById("cancelEditBtn").onclick = () => { state.editId=null; state.err=""; render(); };
    const grab = () => {
      state._editForm = {
        name: val("f_name"), gender: val("f_gender"), gen: val("f_gen"),
        parentId: val("f_parent"), motherName: val("f_motherName"),
        husbandName: val("f_husbandName"), wifeName: val("f_wifeName"),
        birthYear: val("f_birth"), deathYear: val("f_death"), bio: val("f_bio"),
        photos: state._editForm ? state._editForm.photos : [],
      };
    };
    const photoInput = document.getElementById("f_photo");
    if (photoInput) photoInput.onchange = async (e) => {
      const file = e.target.files[0]; if (!file) return;
      grab();
      try { state._editForm.photos.push(await compressImage(file)); } catch(_) {}
      render();
    };
    document.querySelectorAll(".remove-photo-btn").forEach(btn => btn.onclick = () => {
      grab();
      state._editForm.photos.splice(parseInt(btn.dataset.idx), 1);
      render();
    });
    document.getElementById("saveEditBtn").onclick = async () => {
      if (state.busy) return;
      grab();
      if (!state._editForm.name.trim()){ state.err="الاسم مطلوب."; render(); return; }
      const existing = (state.editId!=="new" && !state.editId.startsWith("new-child-")) ? state.people[state.editId] : null;
      const person = {
        id: existing ? existing.id : uid(),
        name: state._editForm.name.trim(), gender: state._editForm.gender,
        gen: Math.max(1, Math.round(Number(state._editForm.gen))||1),
        parentId: state._editForm.parentId || null, motherName: state._editForm.motherName||"",
        husbandName: state._editForm.husbandName||"", wifeName: state._editForm.wifeName||"",
        birthYear: state._editForm.birthYear||"", deathYear: state._editForm.deathYear||"",
        bio: state._editForm.bio||"", photos: state._editForm.photos||[],
        createdAt: existing?.createdAt || Date.now(),
      };
      state.busy = true; state.err=""; render();
      await savePersonCloud(person);
      state.busy = false; state.editId = null; state._editForm=null; state.detailId=person.id; state.err="";
      render();
      scrollToPerson(person.id);
    };
  }

  // Pinch / pan
  const wrap = document.getElementById("canvasWrap");
  if (wrap){
    let pinch = {active:false,startDist:0,startZoom:1,midX:0,midY:0};
    let pan = {active:false,lastX:0,lastY:0,startX:0,startY:0,moved:false};
    let suppressClick = false;
    const dist = (a,b) => Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    const mid = (a,b) => ({x:(a.clientX+b.clientX)/2, y:(a.clientY+b.clientY)/2});
    wrap.addEventListener("touchstart", e => {
      gestureActive = true;
      if (e.touches.length===2){
        const wrapRect = wrap.getBoundingClientRect();
        const m = mid(e.touches[0],e.touches[1]);
        pinch = {active:true, startDist:dist(e.touches[0],e.touches[1]), startZoom:state.zoom,
                 midX:m.x-wrapRect.left, midY:m.y-wrapRect.top};
        pan.active=false;
      } else if (e.touches.length===1){
        pan = {active:true, lastX:e.touches[0].clientX, lastY:e.touches[0].clientY,
               startX:e.touches[0].clientX, startY:e.touches[0].clientY, moved:false};
      }
    });
    wrap.addEventListener("touchmove", e => {
      if (e.touches.length===2 && pinch.active){
        e.preventDefault();
        const wrapRect = wrap.getBoundingClientRect();
        const m = mid(e.touches[0],e.touches[1]);
        const midX = m.x-wrapRect.left, midY = m.y-wrapRect.top;
        const d = dist(e.touches[0],e.touches[1]);
        const newZoom = Math.min(1.6, Math.max(0.08, pinch.startZoom*(d/pinch.startDist)));
        const oldZoom = state.zoom;
        const contentX = (wrap.scrollLeft + midX) / oldZoom;
        const contentY = (wrap.scrollTop + midY) / oldZoom;
        state.zoom = newZoom;
        const canvasEl = document.getElementById("canvas");
        const sizerEl = document.getElementById("canvasSizer");
        if (canvasEl) canvasEl.style.transform = "scale("+newZoom+")";
        if (sizerEl){ sizerEl.style.width = (layout.width*newZoom)+"px"; sizerEl.style.height = (layout.height*newZoom)+"px"; }
        wrap.scrollLeft = contentX*newZoom - midX;
        wrap.scrollTop = contentY*newZoom - midY;
      } else if (e.touches.length===1 && pan.active){
        e.preventDefault();
        const dx = e.touches[0].clientX-pan.lastX, dy = e.touches[0].clientY-pan.lastY;
        wrap.scrollLeft -= dx; wrap.scrollTop -= dy;
        pan.lastX=e.touches[0].clientX; pan.lastY=e.touches[0].clientY;
        if (Math.hypot(e.touches[0].clientX-pan.startX, e.touches[0].clientY-pan.startY) > 8) pan.moved = true;
      }
    });
    wrap.addEventListener("touchend", e => {
      if (pan.active && pan.moved) { suppressClick = true; setTimeout(()=>{suppressClick=false;}, 300); }
      if(e.touches.length<2 && pinch.active){ pinch.active=false; renderApp(); }
      if(e.touches.length<1){ pan.active=false; gestureActive=false; }
    });
    wrap.addEventListener("click", e => {
      if (suppressClick){ e.stopPropagation(); e.preventDefault(); suppressClick=false; }
    }, true);

    // Desktop mouse: wheel to zoom, click-and-drag to pan
    wrap.addEventListener("wheel", e => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.08 : 0.08;
      state.zoom = Math.min(1.6, Math.max(0.08, Math.round((state.zoom+delta)*100)/100));
      renderApp();
    }, {passive:false});
    wrap.addEventListener("mousedown", e => {
      if (e.target.closest(".node")) return;
      gestureActive = true;
      globalMouseDrag = {active:true, lastX:e.clientX, lastY:e.clientY, wrap};
      wrap.style.cursor = "grabbing";
    });
    wrap.style.cursor = "grab";

    // Auto-fit only on first load, never again afterward (so edits/additions don't reset the user's view)
    requestAnimationFrame(() => {
      const fitKey = layout.width+"x"+layout.height;
      if (Object.keys(state.people).length>0 && state.lastFitKey === null){
        state.lastFitKey = fitKey;
        const ww = wrap.clientWidth||360, wh = wrap.clientHeight||500;
        const fit = Math.min(ww/layout.width, wh/layout.height, 1);
        state.zoom = Math.max(0.08, Math.round(fit*100)/100);
        renderApp();
      }
    });
  }
  wirePasswordToggles();
}

// ---------- Boot ----------
(async function boot(){
  if (!window.crypto || !window.crypto.subtle){ state.mode="unsupported"; render(); return; }
  try { const meta = await loadMeta(); state.familyName = meta.familyNameEnc ? "" : (meta.familyName || ""); if (state.familyName) document.title = "شجرة عائلة "+state.familyName; } catch(_) {}
  const rec = await loadAuthRecord();
  if (rec){
    const remembered = loadRememberedSession();
    if (remembered && remembered.rawKeyB64){
      try {
        const cryptoKey = await importDataKey(remembered.rawKeyB64);
        state.session = {role: remembered.role, cryptoKey, rawKeyB64: remembered.rawKeyB64};
        state.mode = "app";
        render();
        await loadPeople();
        startPolling();
        return;
      } catch(_) { forgetSession(); }
    }
  }
  state.mode = rec ? "login" : "setup";
  render();
})();
</script>
</body>
</html>
