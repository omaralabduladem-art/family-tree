<title>شجرة العائلة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap');
*{box-sizing:border-box;}
:root{
  --bg:#0B2B26; --bg-2:#0F332C; --panel:#133830; --panel-2:#175243;
  --gold:#C9A15A; --gold-light:#E9CD8C; --cream:#F2EBDA; --cream-dim:#C9C0AC;
  --male:#4FA3E3; --female:#E87FA8; --danger:#C4685F;
}
body{margin:0;font-family:'Tajawal',sans-serif;background:radial-gradient(ellipse at 50% -10%, var(--bg-2), var(--bg) 60%);color:var(--cream);overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
.ft-login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.ft-login-card{background:var(--panel);border:1px solid rgba(201,161,90,0.35);border-radius:18px;padding:32px 26px;width:100%;max-width:360px;text-align:center;}
.ft-login-card h2{font-family:'Amiri',serif;color:var(--gold-light);font-size:24px;margin:0 0 6px;}
.ft-login-card p{color:var(--cream-dim);font-size:13px;margin:0 0 20px;line-height:1.6;}
.ft-field{margin-bottom:14px;text-align:right;}
.ft-field label{display:block;font-size:12.5px;color:var(--cream-dim);margin-bottom:5px;}
.ft-field input,.ft-field select,.ft-field textarea{width:100%;background:var(--bg-2);border:1px solid rgba(201,161,90,0.3);border-radius:8px;padding:9px 11px;color:var(--cream);font-family:'Tajawal',sans-serif;font-size:14px;box-sizing:border-box;direction:rtl;unicode-bidi:plaintext;}
.ft-field textarea{resize:vertical;min-height:60px;}
.ft-row2{display:flex;gap:10px;}
.ft-row2>div{flex:1;}
.ft-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--gold);color:#0B2B26;border:none;border-radius:999px;padding:9px 18px;font-family:'Tajawal',sans-serif;font-weight:700;font-size:14px;cursor:pointer;}
.ft-btn:hover{background:var(--gold-light);}
.ft-btn.secondary{background:var(--panel-2);color:var(--cream);border:1px solid rgba(201,161,90,0.4);}
.ft-btn.danger{background:var(--danger);color:#2a0f0d;}
.ft-btn:disabled{opacity:0.5;cursor:not-allowed;}
.ft-recovery-code{font-family:monospace;font-size:16px;letter-spacing:1px;color:var(--gold-light);background:var(--bg-2);border:1px dashed rgba(201,161,90,0.5);border-radius:10px;padding:14px;word-break:break-all;direction:ltr;text-align:center;}
.ft-err{color:var(--danger);font-size:13px;margin-bottom:10px;}
header{padding:16px 16px 12px;text-align:center;border-bottom:1px solid rgba(201,161,90,0.25);background:linear-gradient(180deg, rgba(11,43,38,0.9), rgba(11,43,38,0.4));z-index:10;max-width:900px;margin:0 auto;flex-shrink:0;width:100%;}
h1{font-family:'Amiri',serif;font-size:34px;font-weight:700;color:var(--gold-light);margin:0;letter-spacing:0.3px;text-shadow:0 2px 8px rgba(0,0,0,0.4);}
.sub{font-size:12px;color:var(--cream-dim);margin-top:4px;}
.userbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--cream-dim);}
.userbar button{background:none;border:none;color:var(--cream-dim);cursor:pointer;font-size:12px;text-decoration:underline;text-underline-offset:3px;}
.userbar button:hover{color:var(--gold-light);}
.role-badge{background:rgba(201,161,90,0.18);border:1px solid rgba(201,161,90,0.4);border-radius:999px;padding:2px 10px;font-size:11px;color:var(--gold-light);}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:10px;}
.search{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid rgba(201,161,90,0.3);border-radius:999px;padding:7px 14px;min-width:180px;}
.announce-banner{flex-shrink:0;display:flex;align-items:flex-start;gap:10px;max-width:900px;width:calc(100% - 24px);margin:8px auto 0;background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:10px 14px;box-shadow:0 6px 18px rgba(0,0,0,0.3);z-index:11;box-sizing:border-box;}
.announce-banner .announce-text{flex:1;font-size:14px;line-height:1.7;white-space:pre-wrap;color:var(--cream);}
.announce-banner button{flex-shrink:0;background:var(--gold);color:var(--bg);border:none;border-radius:999px;padding:5px 14px;font-family:'Tajawal',sans-serif;font-weight:700;cursor:pointer;}
.wa-row{display:flex;align-items:center;gap:8px;background:var(--bg-2);border:1px solid rgba(201,161,90,0.25);border-radius:10px;padding:7px 10px;}
.wa-send{background:#25D366;color:#0B2B26;border:none;border-radius:999px;padding:5px 12px;font-family:'Tajawal',sans-serif;font-weight:700;font-size:12.5px;cursor:pointer;flex-shrink:0;}
.wa-send.done{background:var(--panel-2);color:var(--cream-dim);border:1px solid rgba(201,161,90,0.35);}
.search-go{background:none;border:none;color:var(--gold-light);cursor:pointer;font-size:14px;padding:0 2px;flex-shrink:0;}
.menu-summary{position:relative;}
.menu-summary .badge-count{position:absolute;top:-5px;right:-5px;margin:0;}
.new-tag{display:inline-block;background:#FF3B30;color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 7px;margin-inline-start:6px;vertical-align:middle;}
.search-toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid rgba(201,161,90,0.5);color:var(--cream);padding:8px 16px;border-radius:8px;z-index:60;font-size:13px;}
.search input{background:transparent;border:none;outline:none;color:var(--cream);font-family:'Tajawal',sans-serif;font-size:13px;width:100%;direction:rtl;unicode-bidi:plaintext;}
.legend{display:flex;gap:6px;justify-content:center;align-items:flex-start;flex-wrap:wrap;margin-top:10px;}
.legend button{background:rgba(23,82,67,0.5);border:1px solid rgba(201,161,90,0.25);color:var(--cream-dim);border-radius:8px;padding:4px 9px;font-size:11px;font-family:'Tajawal',sans-serif;cursor:pointer;}
.legend button:hover{border-color:var(--gold);color:var(--gold-light);}
#canvasWrap{position:relative;flex:1;min-height:0;overflow:auto;touch-action:none;}
#canvas{position:relative;transform-origin:top right;}
.node{position:absolute;width:90px;min-height:60px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;background:linear-gradient(160deg, rgba(31,100,150,0.4), rgba(23,82,67,0.6));border:2px solid var(--male);border-radius:12px;padding:7px 6px;box-shadow:0 3px 10px rgba(0,0,0,0.3);box-sizing:border-box;}
.node.female{border-color:var(--female);background:linear-gradient(160deg, rgba(160,45,90,0.4), rgba(23,82,67,0.6));}
.node.deceased{border-color:#A3A3A3;background:rgba(80,80,80,0.65);}
.node.deceased .name{color:#E2E2E2;}
.node.deceased .years{color:#B5B5B5;}
.node.match{border-color:var(--gold-light);box-shadow:0 0 14px 2px var(--gold-light);}
.node .name{font-family:'Amiri',serif;font-size:15.5px;font-weight:700;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.node .years{font-size:11px;color:var(--cream-dim);margin-top:2px;}
.genlabel{position:absolute;font-size:12.5px;font-weight:600;color:var(--gold-light);opacity:.9;right:10px;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,0.6);}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--cream-dim);}
.zoom{position:fixed;left:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:20;}
.zoom button{width:38px;height:38px;border-radius:50%;background:var(--panel-2);border:1px solid rgba(201,161,90,0.4);color:var(--gold-light);cursor:pointer;font-size:18px;}
.overlay{position:fixed;inset:0;background:rgba(5,15,13,0.72);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:var(--panel);border:1px solid rgba(201,161,90,0.35);border-radius:18px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;padding:22px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
.modal-close{position:absolute;top:14px;left:14px;background:none;border:none;color:var(--cream-dim);cursor:pointer;font-size:20px;}
.detail-avatar{width:110px;height:110px;border-radius:50%;margin:0 auto 12px;object-fit:cover;border:3px solid var(--gold);background:#175243;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:40px;}
.detail-avatar img{width:100%;height:100%;object-fit:cover;}
.detail-avatar{cursor:zoom-in;}
.photo-lightbox{position:fixed;inset:0;background:rgba(5,15,13,0.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:80;padding:16px;cursor:zoom-out;}
.photo-lightbox img{max-width:96vw;max-height:84vh;object-fit:contain;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.6);}
.photo-lightbox .hint{color:var(--cream-dim);font-size:12.5px;}
.detail-name{font-family:'Amiri',serif;font-size:22px;text-align:center;color:var(--gold-light);font-weight:700;}
.detail-meta{text-align:center;color:var(--cream-dim);font-size:13px;margin-top:4px;}
.death-year{color:var(--cream);font-weight:700;font-size:14px;font-family:'Amiri',serif;letter-spacing:0.3px;}
.birth-year{font-family:'Amiri',serif;font-size:14px;letter-spacing:0.3px;color:var(--cream-dim);}
.detail-gen{color:var(--cream);font-weight:700;font-size:14px;font-family:'Amiri',serif;letter-spacing:0.3px;margin-top:3px;}
.node .years .death-year{font-size:11.5px;font-weight:700;color:var(--cream);font-family:'Tajawal',sans-serif;letter-spacing:0;}
.detail-bio{margin-top:14px;font-size:14px;line-height:1.7;color:var(--cream);white-space:pre-wrap;}
.detail-rel{margin-top:14px;font-size:13px;color:var(--cream-dim);}
.nasab{font-family:'Amiri',serif;font-size:14.5px;color:var(--gold-light);line-height:1.8;margin-bottom:10px;}
.detail-rel b{color:var(--cream);}
.modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:center;flex-wrap:wrap;}
.photo-btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed rgba(201,161,90,0.5);border-radius:10px;padding:10px;cursor:pointer;color:var(--cream-dim);font-size:13px;}
.photo-preview{width:60px;height:60px;border-radius:50%;object-fit:cover;margin-left:8px;}
.err-toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--danger);color:#2a0f0d;padding:8px 16px;border-radius:8px;z-index:60;font-size:13px;}
.spin{display:inline-block;animation:spin 1s linear infinite;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@media (min-width: 720px){
  header{max-width:1100px;padding:24px 24px 16px;}
  h1{font-size:38px;}
  .sub{font-size:15px;}
  .ft-btn{padding:11px 24px;font-size:15px;}
  #canvasWrap{cursor:grab;}
  #canvasWrap:active{cursor:grabbing;}
  .ft-login-card{max-width:420px;padding:40px 34px;}
  .ft-login-card h2{font-size:28px;}
  .zoom button{width:44px;height:44px;font-size:18px;}
}
@media (min-width: 1100px){
  header{max-width:1300px;}
}

/* ---- Mobile-friendly enhancements (additive only, does not remove/replace anything above) ---- */
@media (max-width: 480px){
  h1{font-size:26px;}
  .sub{font-size:12.5px;}
  .userbar{font-size:13px;gap:12px;}
  .userbar button{font-size:13px;padding:4px 2px;}
  .role-badge{font-size:12px;padding:4px 12px;}
  .toolbar{gap:10px;}
  .ft-btn{padding:11px 16px;font-size:14.5px;min-height:44px;}
  .ft-btn.secondary{min-height:44px;}
  .search{padding:9px 14px;min-width:150px;}
  .search input{font-size:15px;}
  .legend{gap:8px;}
  .legend button{padding:7px 12px;font-size:12.5px;min-height:36px;}
  .node{width:78px;padding:6px 5px;}
  .node .name{font-size:13.5px;}
  .node .years{font-size:10.5px;}
  .zoom{left:12px;bottom:20px;gap:8px;}
  .zoom button{width:46px;height:46px;font-size:20px;}
  .modal{padding:18px;border-radius:16px;max-height:92vh;}
  .modal-close{top:12px;left:12px;font-size:22px;padding:6px;}
  .detail-name{font-size:20px;}
  .modal-actions{gap:10px;}
  .modal-actions .ft-btn{flex:1 1 auto;min-width:100px;min-height:46px;}
  .ft-field input,.ft-field select,.ft-field textarea{padding:11px 12px;font-size:16px;}
  .pw-toggle{font-size:18px;padding:8px;}
  header{padding:10px 12px 6px;}
  h1{margin-bottom:0;}
  .sub{margin-top:2px;}
  .userbar{margin-top:5px;}

// ---------- Crypto helpers ----------
function bufToB64(buf){ const b=new Uint8Array(buf); let s=""; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function b64ToBuf(b64){ const s=atob(b64); const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return b.buffer; }
function randomSaltB64(){ return bufToB64(crypto.getRandomValues(new Uint8Array(16)).buffer); }
async function deriveKey(password, saltB64){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64ToBuf(saltB64), iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encryptText(key, text){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const c = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(text));
  return bufToB64(iv)+"."+bufToB64(c);
}
async function decryptText(key, combined){
  const [ivB64,dataB64] = combined.split(".");
  const iv = new Uint8Array(b64ToBuf(ivB64));
  const p = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, b64ToBuf(dataB64));
  return new TextDecoder().decode(p);
}
async function generateDataKeyRawB64(){
  const key = await crypto.subtle.generateKey({name:"AES-GCM", length:256}, true, ["encrypt","decrypt"]);
  return bufToB64(await crypto.subtle.exportKey("raw", key));
}
async function importDataKey(rawB64){
  return crypto.subtle.importKey("raw", b64ToBuf(rawB64), {name:"AES-GCM"}, false, ["encrypt","decrypt"]);
}
async function wrapDataKeyFor(secret, rawDataKeyB64){
  const salt = randomSaltB64();
  const key = await deriveKey(secret, salt);
  const wrap = await encryptText(key, rawDataKeyB64);
  return {salt, wrap};
}
function generateRecoveryCode(){
  const b = crypto.getRandomValues(new Uint8Array(15));
  const hex = Array.from(b).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();
  return hex.match(/.{1,4}/g).join("-");
}

}

function ordinalAr(n){
  const ones = ["","الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع"];
  const teens = ["العاشر","الحادي عشر","الثاني عشر","الثالث عشر","الرابع عشر","الخامس عشر","السادس عشر","السابع عشر","الثامن عشر","التاسع عشر"];
  const tensWords = ["","","العشرون","الثلاثون","الأربعون","الخمسون"];
  if (n>=1 && n<=9) return ones[n];
  if (n>=10 && n<=19) return teens[n-10];
  if (n>=20 && n<=59){
    const tens = Math.floor(n/10), rem = n%10;
    if (rem===0) return tensWords[tens];
    return ones[rem]+" و"+tensWords[tens];
  }
  return "رقم "+n;
}
function genLabel(n){ return n===1 ? "الجيل الأول — الجد الأكبر" : "الجيل "+ordinalAr(n); }
function uid(){ return "p_"+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function elbowPath(x1,y1,x2,y2,r){
  if (Math.abs(x1-x2) < 1) return "M "+x1+" "+y1+" L "+x2+" "+y2;
  const midY=(y1+y2)/2, dir=x2>x1?1:-1;
  const rr = Math.max(0, Math.min(r, Math.abs(x2-x1)/2, Math.abs(midY-y1), Math.abs(y2-midY)));
  return "M "+x1+" "+y1+" L "+x1+" "+(midY-rr)+" Q "+x1+" "+midY+" "+(x1+rr*dir)+" "+midY+" L "+(x2-rr*dir)+" "+midY+" Q "+x2+" "+midY+" "+x2+" "+(midY+rr)+" L "+x2+" "+y2;
}
async function compressImage(file, maxSize=220, quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let {width,height} = img;
        if (width>height){ if(width>maxSize){height*=maxSize/width; width=maxSize;} }
        else { if(height>maxSize){width*=maxSize/height; height=maxSize;} }
        const c = document.createElement("canvas"); c.width=width; c.height=height;
        c.getContext("2d").drawImage(img,0,0,width,height);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function normalizeArabic(s){
  return (s||"")
    .replace(/[\u200B-\u200F\u202A-\u202E\u2066-\u2069\uFEFF]/g, "")
    .replace(/[\u064B-\u065F\u0670]/g, "")
    .replace(/\u0640/g, "")
    .replace(/[\u0622\u0623\u0625\u0671]/g, "\u0627")
    .replace(/\u0649/g, "\u064A")
    .replace(/\u0629/g, "\u0647")
    .replace(/\s+/g, " ")
    .trim();
}
const NASAB_WORDS = ["بن","بنت","ابن","ابنه"];
function stripNasabWords(s){
  return normalizeArabic(s).split(" ").filter(w => w && NASAB_WORDS.indexOf(w) === -1).join(" ");
}
// Full-name search: "محمد بن علي بن أحمد" (with or without بن) matches the person whose own name
// is محمد, father علي, grandfather أحمد. A single word keeps the word-start match on the person's own name.
function personMatchesSearch(p, term){
  if (!p || !term) return false;
  const t = stripNasabWords(term);
  if (!t) return false;
  if (t.indexOf(" ") === -1 && nameMatchesSearch(p.name, t)) return true;
  const parts = []; let cur = p, guard = 0;
  while (cur && guard < 100){
    parts.push(stripNasabWords(cur.name));
    cur = cur.parentId ? state.people[cur.parentId] : null; guard++;
  }
  return parts.join(" ").indexOf(t) === 0;
}
function nameMatchesSearch(name, term){
  const n = normalizeArabic(name), t = normalizeArabic(term);
  if (!n || !t) return false;
  const words = n.split(" ");
  for (let i=0; i<words.length; i++){
    if (words.slice(i).join(" ").indexOf(t) === 0) return true;
  }
  return false;
}

// ---------- Layout ----------
function computeEffectiveGen(people){
  const childrenMap = {};
  Object.values(people).forEach(p=>{ if(p.parentId && people[p.parentId]) (childrenMap[p.parentId]=childrenMap[p.parentId]||[]).push(p.id); });
  const roots = Object.values(people).filter(p=>!p.parentId || !people[p.parentId]).map(p=>p.id);
  const effectiveGen = {};
  function assignGen(id, g){
    if (effectiveGen[id] !== undefined) return;
    effectiveGen[id] = g;
    (childrenMap[id]||[]).forEach(cid => assignGen(cid, g+1));
  }
  roots.forEach(id => assignGen(id, 1));
  Object.values(people).forEach(p => { if (effectiveGen[p.id] === undefined) assignGen(p.id, 1); });
  return effectiveGen;
}
function computeLayout(people){
  const list = Object.values(people);
  const childrenMap = {};
  list.forEach(p=>{ if(p.parentId && people[p.parentId]) (childrenMap[p.parentId]=childrenMap[p.parentId]||[]).push(p.id); });
  const roots = list.filter(p=>!p.parentId || !people[p.parentId]).map(p=>p.id);
  const rankOf = id => (people[id].order ?? people[id].createdAt ?? 0);
  roots.sort((a,b)=> rankOf(a)-rankOf(b));
  Object.values(childrenMap).forEach(arr=>arr.sort((a,b)=> rankOf(a)-rankOf(b)));
  const effectiveGen = computeEffectiveGen(people);

  const xPos = {}; let cursor = 0; let lastParentId = undefined; const visited = new Set();
  function assignX(id, parentId){
    if (visited.has(id)) return xPos[id];
    visited.add(id);
    const kids = childrenMap[id]||[];
    if (kids.length===0){
      if (lastParentId !== undefined) cursor += (parentId===lastParentId ? 0.95 : 1.3);
      xPos[id]=cursor; lastParentId = parentId;
    }
    else { kids.forEach(k=>assignX(k,id)); const xs=kids.map(k=>xPos[k]); xPos[id]=(Math.min(...xs)+Math.max(...xs))/2; }
    return xPos[id];
  }
  roots.forEach(id=>assignX(id, null));
  list.forEach(p=>{ if(!visited.has(p.id)) assignX(p.id, p.parentId||null); });

  const maxGen = Math.max(1, ...list.map(p=>effectiveGen[p.id]||1));
  const positions = {};
  list.forEach(p=>{ const g=Math.max(effectiveGen[p.id]||1,1); positions[p.id] = {x: xPos[p.id]??0, row: g-1, gen: g}; });
  const width = (cursor+2)*COL_WIDTH + 220;
  const height = maxGen*ROW_HEIGHT + 140;
  const genRowStart = {}; for (let g=1; g<=maxGen; g++) genRowStart[g] = g-1;
  return {positions, width, height, maxGen, genRowStart};
}
const pxX = x => 80 + x*COL_WIDTH;
const pxY = row => 60 + row*ROW_HEIGHT;
function siblingsUnder(people, parentId, excludeId){
  const key = parentId || null;
  return Object.values(people)
    .filter(p => (p.parentId||null) === key && p.id !== excludeId)
    .sort((a,b) => (a.order ?? a.createdAt ?? 0) - (b.order ?? b.createdAt ?? 0));
}
function collectBranch(rootId){
  const result = [];
  const queue = [rootId];
  const seen = new Set();
  while (queue.length){
    const id = queue.shift();
    if (seen.has(id)) continue;
    seen.add(id);
    const p = state.people[id];
    if (!p) continue;
    result.push(p);
    Object.values(state.people).forEach(c => { if (c.parentId === id) queue.push(c.id); });
  }
  return result;
}
function scrollToPerson(id){
  requestAnimationFrame(() => {
    const wrap = document.getElementById("canvasWrap");
    const node = wrap && document.querySelector('.node[data-id="'+id+'"]');
    if (!wrap || !node) return;
    const zoom = state.zoom || 1;
    const targetLeft = (node.offsetLeft + node.offsetWidth/2) * zoom - wrap.clientWidth/2;
    const targetTop = (node.offsetTop + node.offsetHeight/2) * zoom - wrap.clientHeight/2;
    wrap.scrollLeft = Math.max(0, targetLeft);
    wrap.scrollTop = Math.max(0, targetTop);
  });
}
function applyZoomFactor(factor){
  const wrap = document.getElementById("canvasWrap");
  const oldZoom = state.zoom;
  const newZoom = Math.min(1.6, Math.max(0.08, Math.round(oldZoom*factor*100)/100));
  if (!wrap){ state.zoom = newZoom; renderApp(); return; }
  const ax = wrap.clientWidth/2, ay = wrap.clientHeight/2;
  const contentX = (wrap.scrollLeft + ax) / oldZoom;
  const contentY = (wrap.scrollTop + ay) / oldZoom;
  state.zoom = newZoom;
  renderApp();
  const newWrap = document.getElementById("canvasWrap");
  if (newWrap){
    newWrap.scrollLeft = Math.max(0, contentX*newZoom - ax);
    newWrap.scrollTop = Math.max(0, contentY*newZoom - ay);
  }
}

  try {

        state.quotes = JSON.parse(raw) || [];
      } catch(_) { state.quotes = []; }
    } else { state.quotes = []; }

  } catch(_) {}

  const meta = await loadMeta();
  const quotesEnc = await encryptText(state.session.cryptoKey, JSON.stringify(list));
  const cleanMeta = {...meta};
  await saveMeta({...cleanMeta, quotesEnc});
  state.quotes = list;
  if (!state.currentQuote && list.length){
    state.currentQuote = list[Math.floor(Math.random()*list.length)];
  }
}
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function wrapCanvasText(ctx,text,cx,y,maxWidth,lineHeight){
  const words = text.split(" ");
  let line = "";
  const lines = [];
  for (const rawWord of words){
    let word = rawWord;
    while (ctx.measureText(word).width > maxWidth && word.length > 1){
      let i = 1;
      while (i < word.length && ctx.measureText(word.slice(0,i)).width <= maxWidth) i++;
      lines.push(word.slice(0, Math.max(1,i-1)));
      word = word.slice(Math.max(1,i-1));
    }
    const test = line ? line+" "+word : word;
    if (ctx.measureText(test).width > maxWidth && line){
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  lines.forEach((ln,i) => ctx.fillText(ln, cx, y+i*lineHeight));
  return lines.length*lineHeight;
}

async function fetchAndDecryptMessages(){
  const raw = await fbGet(PATH_PREFIX+"messages");
  const list = [];
  if (raw){
    for (const [id, cipher] of Object.entries(raw)){
      try {
        const plain = await decryptText(state.session.cryptoKey, cipher);
        const obj = JSON.parse(plain);
        obj.id = id;
        list.push(obj);
      } catch(_) {}
    }
  }
  list.sort((a,b) => (b.sentAt||0) - (a.sentAt||0));
  return list;
}

function toWhatsAppNumber(phone){
  let d = String(phone||"")
    .replace(/[\u0660-\u0669]/g, c => String(c.charCodeAt(0)-0x0660))
    .replace(/[\u06F0-\u06F9]/g, c => String(c.charCodeAt(0)-0x06F0))
    .replace(/[^\d]/g, "");
  if (d.indexOf("00") === 0) d = d.slice(2);
  if (d.indexOf("05") === 0 && d.length === 10) d = "966"+d.slice(1);
  else if (d.indexOf("5") === 0 && d.length === 9) d = "966"+d;
  return d.length >= 8 ? d : "";
}
async function loadWaContacts(){
  const [raw, invites] = await Promise.all([fbGet(PATH_PREFIX+"joinRequests"), fetchInvites()]);
  const list = [], seen = new Set();
  const add = (name, phone, source) => {
    const num = toWhatsAppNumber(phone);
    if (!num || seen.has(num)) return;
    seen.add(num);
    list.push({name: name||"", phone: phone, num, source});
  };
  if (raw) Object.values(raw).forEach(r => { if (r && r.status !== "rejected") add(r.name, r.phone, r.status === "approved" ? "عضو" : "طلب انضمام"); });
  (invites||[]).forEach(inv => { if (inv.phone) add(inv.name, inv.phone, "مدعو"); });
  list.sort((a,b) => (a.name||"").localeCompare(b.name||"", "ar"));
  return list;
}

async function loadPeople(){
  try {
    const [data, meta] = await Promise.all([fbGet(PATH_PREFIX+"persons"), loadMeta()]);
    const loaded = {};
    if (data){
      for (const cipher of Object.values(data)){
        try {
          const plain = await decryptText(state.session.cryptoKey, cipher);
          const p = JSON.parse(plain);
          if (!Array.isArray(p.photos)) p.photos = p.photo ? [p.photo] : [];
          loaded[p.id] = p;
        } catch(_) {}
      }
    }
    state.people = loaded;
    if (meta.familyNameEnc){
      try { state.familyName = await decryptText(state.session.cryptoKey, meta.familyNameEnc); }
      catch(_) { state.familyName = ""; }
    } else {
      state.familyName = meta.familyName || "";
    }
    if (state.familyName) updateAppTitle(state.familyName);
    if (meta.linkedBigTreeKeyEnc){
      try { state.bigTreeKeyB64 = await decryptText(state.session.cryptoKey, meta.linkedBigTreeKeyEnc); }
      catch(_) { state.bigTreeKeyB64 = null; }
    } else { state.bigTreeKeyB64 = null; }
    await loadQuotes();
    await loadAnnouncement();
    if (state.session.role === "admin"){ await loadJoinRequestsCount(); await loadUnreadMessagesCount(); }
    render();
  } catch(e){
    state.err = "تعذّر تحميل البيانات.";
    render();
  }
}

async function deletePersonCloud(id){

async function attemptEmailLogin(email, code){
  const key = emailKeyOf(email);
  const rec = await fbGet(PATH_PREFIX+"emailUsers/"+key);
  if (!rec) throw new Error("not found");
  const k = await deriveKey(code, rec.salt);
  const rawKeyB64 = await decryptText(k, rec.wrap);
  if (!rec.passwordSet){
    state.pendingEmailKey = key;
    state.pendingEmailAddr = rec.email || email;
    state.pendingRawKeyB64 = rawKeyB64;
    state.mode = "email-setpass";
    state.err = "";
  } else {
    const cryptoKey = await importDataKey(rawKeyB64);
    state.session = {role:"viewer", cryptoKey, rawKeyB64, emailIdentity: rec.email || email};
    rememberSession("viewer", rawKeyB64, rec.email || email);
    rememberEmailAddr(rec.email || email);
    state.mode = "app";
    render();
    incrementCounter(PATH_PREFIX+"stats/totalLogins");
    await loadPeople();
    startPolling();
  }
}
function wireLoginEvents(){

  const finishBtn = document.getElementById("finishSetupBtn");

    const cryptoKey = await importDataKey(state.pendingDataKeyB64);
    state.session = {role:"admin", cryptoKey, rawKeyB64: state.pendingDataKeyB64};
      rememberSession("admin", state.pendingDataKeyB64);

    incrementCounter(PATH_PREFIX+"stats/totalLogins");

    startPolling();
  };
  function validateThreeTier(){
    const adminPw=val("adminPw"), adminPw2=val("adminPw2"), editPw=val("editPw"), editPw2=val("editPw2"), viewPw=val("viewPw"), viewPw2=val("viewPw2");
    if (adminPw.length<6) return "كلمة مرور المسؤول 6 أحرف على الأقل.";
    if (adminPw!==adminPw2) return "كلمتا مرور المسؤول غير متطابقتين.";
    if (editPw.length<6) return "كلمة مرور التعديل 6 أحرف على الأقل.";
    if (editPw!==editPw2) return "كلمتا مرور التعديل غير متطابقتين.";
    if (viewPw.length<6) return "كلمة مرور المشاهدة 6 أحرف على الأقل.";
    if (viewPw!==viewPw2) return "كلمتا مرور المشاهدة غير متطابقتين.";
    const set = new Set([adminPw,editPw,viewPw]);
    if (set.size < 3) return "اجعل الكلمات الثلاث مختلفة عن بعضها.";
    return null;
  }
  const setupBtn = document.getElementById("setupBtn");
  if (setupBtn) setupBtn.onclick = async () => {

    state.busy = true; render();
    try {
      const rawKey = await generateDataKeyRawB64();
      const adminWrap = await wrapDataKeyFor(adminPw, rawKey);
      const editWrap = await wrapDataKeyFor(editPw, rawKey);
      const viewWrap = await wrapDataKeyFor(viewPw, rawKey);
      const code = generateRecoveryCode();
      const recWrap = await wrapDataKeyFor(code, rawKey);
      await saveAuthRecord({
        adminSalt:adminWrap.salt, adminWrap:adminWrap.wrap,
        editSalt:editWrap.salt, editWrap:editWrap.wrap,
        viewSalt:viewWrap.salt, viewWrap:viewWrap.wrap,

      state.pendingDataKeyB64 = rawKey;
      state.mode = "setup-recovery";
    } catch(e){ state.err = "تعذّر الإعداد: "+(e.message||e); }
    state.busy = false; render();
  };
  const loginBtn = document.getElementById("loginBtn");
  if (loginBtn) loginBtn.onclick = async () => {
    const pw = val("loginPw");
    state.err = ""; state.busy = true; render();
    try {
      const rec = await loadAuthRecord();
      let role = null, cryptoKey = null, rawKeyB64 = null;
      try {
        const k = await deriveKey(pw, rec.adminSalt);
        const raw = await decryptText(k, rec.adminWrap);
        cryptoKey = await importDataKey(raw); role = "admin"; rawKeyB64 = raw;
      } catch(_) {}
      if (!role){
        try {
          const k = await deriveKey(pw, rec.editSalt);
          const raw = await decryptText(k, rec.editWrap);
          cryptoKey = await importDataKey(raw); role = "editor"; rawKeyB64 = raw;
        } catch(_) {}
      }
      if (!role){
        const k = await deriveKey(pw, rec.viewSalt);

    const name = val("joinName"), email = val("joinEmail"), phone = val("joinPhone");

    if (!phone.trim()){ state.err="رقم الجوال مطلوب."; render(); return; }
    state.busy = true; render();
    try {
      await fbSet(PATH_PREFIX+"joinRequests/"+uid(), {name:name.trim(), email:email.trim(), phone:phone.trim(), requestedAt: Date.now(), status:"pending", tempCode:null});
      state.joinRequestSent = true;
    } catch(e){ state.err = "تعذّر إرسال الطلب."; }
    state.busy = false; render();
  };
  const backToNormalLoginBtn = document.getElementById("backToNormalLoginBtn");
  if (backToNormalLoginBtn) backToNormalLoginBtn.onclick = () => { state.mode="login"; state.err=""; render(); };
  const emailLoginSubmitBtn = document.getElementById("emailLoginSubmitBtn");

    const email = val("emailLoginEmail");
    const code = val("emailLoginCode");

    state.busy = true; render();
    try {
      await attemptEmailLogin(email, code);
    } catch(e){ state.err = "البريد غير مسجّل أو كلمة المرور/الرمز غير صحيح."; }
    state.busy = false; render();
  };
  const emailSetPassBtn = document.getElementById("emailSetPassBtn");
  if (emailSetPassBtn) emailSetPassBtn.onclick = async () => {
    const pw = val("emailNewPw"), pw2 = val("emailNewPw2");

    if (pw !== pw2){ state.err = "كلمتا المرور غير متطابقتين."; render(); return; }
    state.busy = true; render();
    try {
      const wrap = await wrapDataKeyFor(pw, state.pendingRawKeyB64);
      await fbSet(PATH_PREFIX+"emailUsers/"+state.pendingEmailKey, {
        email: state.pendingEmailAddr, addedAt: Date.now(), salt: wrap.salt, wrap: wrap.wrap, passwordSet: true,
      });
      const cryptoKey = await importDataKey(state.pendingRawKeyB64);
      state.session = {role:"viewer", cryptoKey, rawKeyB64: state.pendingRawKeyB64, emailIdentity: state.pendingEmailAddr};
      rememberSession("viewer", state.pendingRawKeyB64, state.pendingEmailAddr);
      rememberEmailAddr(state.pendingEmailAddr);
      state.pendingEmailKey = null; state.pendingEmailAddr = ""; state.pendingRawKeyB64 = null;
      state.mode = "app";
      render();
      incrementCounter(PATH_PREFIX+"stats/totalLogins");
      await loadPeople();
      startPolling();
    } catch(e){ state.err = "تعذّر حفظ كلمة المرور."; }
    state.busy = false; render();
  };
  const recoverBtn = document.getElementById("recoverBtn");
  if (recoverBtn) recoverBtn.onclick = async () => {
    const code = val("recInput").trim().toUpperCase();

    try {
      const rec = await loadAuthRecord();
      const k = await deriveKey(code, rec.recSalt);

      render();

function wirePasswordToggles(){
  document.querySelectorAll(".pw-toggle").forEach(btn => btn.onclick = () => {
    const input = document.getElementById(btn.dataset.target);
    if (!input) return;
    const selStart = input.selectionStart, selEnd = input.selectionEnd;
    if (input.type === "password"){ input.type = "text"; btn.textContent = "🙈"; }
    else { input.type = "password"; btn.textContent = "👁️"; }
    input.focus();
    try { input.setSelectionRange(selStart, selEnd); } catch(_) {}
  });
}
function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ""; }

function startPolling(){
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => {
    if (state.mode==="app" && state.session && !state.busy && !state.editId && !state.showChangePw && !state.showFamilyName && !state.showQuotesModal && !state.showStats && !state.showContactModal && !state.showMessagesModal && !state.showMyMessagesModal && !state.showEmailUsersModal && !state.showCheckMessagesModal && !state.showJoinRequestsModal && !state.showBranchExportModal && !state.showBranchImportModal && !state.showInviteModal && !state.showAnnounceModal && !state.showWaModal && !state.showLinkTreeModal && !gestureActive) loadPeople();
  }, 7000);
  startPresenceHeartbeat();
}

function renderApp(){
  const isAdmin = state.session.role === "admin";
  const isEditor = isAdmin || state.session.role === "editor";
  const layout = computeLayout(state.people);
  const peopleCount = Object.keys(state.people).length;

  let kinshipHighlightSet = null;
  if (state.kinshipMode === "result" && state.kinshipPickA && state.kinshipPickB){
    kinshipHighlightSet = new Set();
    const r = findCommonAncestor(state.kinshipPickA, state.kinshipPickB);
    if (r){
      let cur = state.people[state.kinshipPickA], guard=0;
      while (cur && guard<100){ kinshipHighlightSet.add(cur.id); if (cur.id===r.ancestorId) break; cur = cur.parentId ? state.people[cur.parentId] : null; guard++; }
      cur = state.people[state.kinshipPickB]; guard=0;
      while (cur && guard<100){ kinshipHighlightSet.add(cur.id); if (cur.id===r.ancestorId) break; cur = cur.parentId ? state.people[cur.parentId] : null; guard++; }
    } else {
      kinshipHighlightSet.add(state.kinshipPickA); kinshipHighlightSet.add(state.kinshipPickB);
    }
  }

  let html = '';
  if (state.err) html += '<div class="err-toast">'+esc(state.err)+'</div>';

    let bannerText = "";

      bannerText = state.kinshipPickA ? "اختر الشخص الثاني من الشجرة..." : "اختر الشخص الأول من الشجرة...";
    } else {
      const r = findCommonAncestor(state.kinshipPickA, state.kinshipPickB);
      const nameA = esc(state.people[state.kinshipPickA]?.name||"");

        bannerText = "<b>"+parentName+"</b> سلف مباشر لـ<b>"+childName+"</b> ("+dist+" "+(dist===1?"جيل":"أجيال")+")";
      } else {
        const ancestorName = esc(state.people[r.ancestorId]?.name||"");

    + (peopleCount>0 ? peopleCount+' فرداً · '+layout.maxGen+' '+(layout.maxGen===1?'جيل':'أجيال') : 'ابدأ ببناء شجرة عائلتك')

    + '<div class="menu-details"><button type="button" class="menu-summary" id="menuToggleBtn">⋯'+((isAdmin && (state.pendingJoinCount+state.unreadMsgCount)>0)?'<span class="badge-count">'+(state.pendingJoinCount+state.unreadMsgCount)+'</span>':'')+'</button><div class="menu-buttons" style="display:'+(state.menuOpen?'flex':'none')+';">'

function computeStats(){
  const list = Object.values(state.people);
  const total = list.length;
  const males = list.filter(p=>p.gender==='m').length;
  const females = list.filter(p=>p.gender==='f').length;
  const deceased = list.filter(p=>p.deceased || (p.deathYear && String(p.deathYear).trim())).length;
  const alive = total - deceased;
  const byGen = {};
  const effectiveGen = computeEffectiveGen(state.people);
  list.forEach(p=>{ const g = Math.max(effectiveGen[p.id]||1,1); byGen[g] = (byGen[g]||0)+1; });
  const genRows = Object.keys(byGen).map(Number).sort((a,b)=>a-b).map(g=>({gen:g,count:byGen[g]}));
  const nameCounts = {};
  function normalizeNameKey(s){
    return (s||"")
      .replace(/[\u200B-\u200F\u202A-\u202E\uFEFF]/g, "")
      .replace(/[\u064B-\u065F\u0670]/g, "")
      .replace(/ـ/g, "")
      .trim();
  }
  list.forEach(p=>{
    const first = normalizeNameKey((p.name||"").trim().split(/\s+/)[0]);
    if (first) nameCounts[first] = (nameCounts[first]||0)+1;
  });
  const topNames = Object.entries(nameCounts).sort((a,b)=>b[1]-a[1]).slice(0,10);
  return {total, males, females, deceased, alive, genRows, topNames};
}

function findCommonAncestor(idA, idB){
  if (!idA || !idB || !state.people[idA] || !state.people[idB]) return null;
  const chainA = []; { let cur = state.people[idA], guard=0; while (cur && guard<100){ chainA.push(cur.id); cur = cur.parentId ? state.people[cur.parentId] : null; guard++; } }
  const chainB = []; { let cur = state.people[idB], guard=0; while (cur && guard<100){ chainB.push(cur.id); cur = cur.parentId ? state.people[cur.parentId] : null; guard++; } }
  const setA = new Map(chainA.map((id,i)=>[id,i]));
  for (let j=0; j<chainB.length; j++){
    if (setA.has(chainB[j])) return {ancestorId: chainB[j], distA: setA.get(chainB[j]), distB: j};
  }
  return null;
}

async function fetchInvites(){
  const raw = await fbGet(PATH_PREFIX+"invites");
  const list = [];
  if (raw){
    for (const [id, cipher] of Object.entries(raw)){
      try {
        const obj = JSON.parse(await decryptText(state.session.cryptoKey, cipher));
        obj.id = id;
        list.push(obj);
      } catch(_) {}
    }
  }
  list.sort((a,b) => (b.invitedAt||0) - (a.invitedAt||0));
  return list;
}
function findInviteDup(name){
  const n = normalizeArabic(name);
  if (!n || !state.inviteList) return null;
  return state.inviteList.find(inv => normalizeArabic(inv.name) === n) || null;
}
function inviteDateStr(ts){
  try { return new Intl.DateTimeFormat('ar-SA', {year:'numeric', month:'long', day:'numeric'}).format(new Date(ts)); } catch(_) { return ""; }
}

          + '<button class="ft-btn secondary" style="width:100%;justify-content:center;margin-top:8px;font-size:12.5px;" id="downloadWelcomeCardBtn_'+r.id+'">'+(state.copiedWelcomeId===r.id?'✅ جاهزة — الصقها مع الصورة':'🖼️ بطاقة الترحيب (صورة + بيانات)')+'</button>';

function wireAppEvents(layout){
  document.querySelectorAll('.ft-field input[dir="rtl"], .ft-field textarea[dir="rtl"], .search input[dir="rtl"]').forEach(el => {
    el.addEventListener('input', () => {
      requestAnimationFrame(() => { el.scrollLeft = -el.scrollWidth; });
    });
  });
  const searchInput = document.getElementById("searchInput");
  const applySearchHighlights = () => {
    const term = (state.searchApplied||"").trim();
    document.querySelectorAll(".node").forEach(n => {
      n.classList.toggle("match", !!(term && personMatchesSearch(state.people[n.dataset.id], term)));
    });
  };
  const runSearch = () => {
    if (!searchInput) return;
    state.search = searchInput.value;
    state.searchApplied = state.search.trim();
    state.highlightGen = null;
    applySearchHighlights();
    const term = state.searchApplied;
    if (!term) return;
    const searchLayout = computeLayout(state.people);
    const matches = Object.values(state.people).filter(p => personMatchesSearch(p, term));
    if (matches.length){
      matches.sort((a,b) => (searchLayout.positions[a.id]?.gen||1) - (searchLayout.positions[b.id]?.gen||1));
      scrollToPerson(matches[0].id);
      searchInput.blur();
      showSearchToast(matches.length===1 ? "نتيجة واحدة" : matches.length+" نتائج");
    } else {
      showSearchToast("لا يوجد اسم يطابق «"+term+"»");
    }
  };
  if (searchInput){
    searchInput.oninput = e => {
      state.search = e.target.value;
      if (!state.search.trim() && state.searchApplied){
        state.searchApplied = "";
        applySearchHighlights();
      }
    };
    searchInput.onkeydown = e => {
      if (e.key === "Enter"){ e.preventDefault(); runSearch(); }
    };
  }
  const searchGoBtn = document.getElementById("searchGoBtn");
  if (searchGoBtn) searchGoBtn.onclick = runSearch;
  document.getElementById("logoutBtn").onclick = () => { if(pollTimer) clearInterval(pollTimer); forgetSession(); state.session=null; state.mode="login"; state.people={}; render(); };
  document.getElementById("syncNowBtn").onclick = () => loadPeople();
  const toggleHeaderBtn = document.getElementById("toggleHeaderBtn");
  if (toggleHeaderBtn) toggleHeaderBtn.onclick = () => { state.hideHeaderMobile = !state.hideHeaderMobile; renderApp(); };
  const menuToggleBtn = document.getElementById("menuToggleBtn");
  if (menuToggleBtn) menuToggleBtn.onclick = (e) => {
    e.stopPropagation();
    state.menuOpen = !state.menuOpen;
    renderApp();
  };
  document.querySelectorAll(".legend button").forEach(b => b.onclick = () => {
    const g = parseInt(b.dataset.gen);
    state.search = "";
    state.searchApplied = "";
    state.highlightGen = g;
    renderApp();
    const genLayout = computeLayout(state.people);
    const inGen = Object.values(state.people).filter(p => (genLayout.positions[p.id]?.gen||1) === g);
    if (inGen.length){
      inGen.sort((a,b2) => (genLayout.positions[a.id]?.x||0) - (genLayout.positions[b2.id]?.x||0));
      scrollToPerson(inGen[0].id);
    }
  });
  const showStatsBtn = document.getElementById("showStatsBtn");
  if (showStatsBtn) showStatsBtn.onclick = () => {
    state.showStats = true; state.visitorStats = null; render();
    if (state.session && state.session.role === "admin"){
      (async () => {
        try {
          const [opens, logins, presence] = await Promise.all([
            fbGet(PATH_PREFIX+"stats/totalOpens"),
            fbGet(PATH_PREFIX+"stats/totalLogins"),
            fbGet(PATH_PREFIX+"presence"),
          ]);
          const now = Date.now();
          let online = 0;
          const stale = [];
          if (presence){
            Object.entries(presence).forEach(([sid, ts]) => {
              if (now - ts < 45000) online++;
              else if (now - ts > 300000) stale.push(sid);
            });
          }
          state.visitorStats = { opens: opens||0, logins: logins||0, online };
          stale.forEach(sid => { fbDelete(PATH_PREFIX+"presence/"+sid).catch(()=>{}); });
        } catch(_) { state.visitorStats = { opens: 0, logins: 0, online: 0 }; }
        if (state.showStats) render();
      })();
    }
  };
  const statsOverlay = document.getElementById("statsOverlay");
  if (statsOverlay){
    statsOverlay.onclick = () => { state.showStats=false; render(); };
    document.getElementById("closeStatsBtn").onclick = () => { state.showStats=false; render(); };
  }
  const showKinshipBtn = document.getElementById("showKinshipBtn");
  if (showKinshipBtn) showKinshipBtn.onclick = () => {
    state.kinshipMode = "picking"; state.kinshipPickA = null; state.kinshipPickB = null; renderApp();
  };
  const kinshipCancelBtn = document.getElementById("kinshipCancelBtn");
  if (kinshipCancelBtn) kinshipCancelBtn.onclick = (e) => {
    e.stopPropagation();
    state.kinshipMode = null; state.kinshipPickA = null; state.kinshipPickB = null; renderApp();
  };
  const kinshipOverlay = document.getElementById("kinshipOverlay");
  if (kinshipOverlay){
    kinshipOverlay.onclick = () => { state.showKinship=false; state.kinshipA=""; state.kinshipB=""; render(); };
    document.getElementById("closeKinshipBtn").onclick = () => { state.showKinship=false; state.kinshipA=""; state.kinshipB=""; render(); };
    document.getElementById("kinshipASelect").onchange = e => { state.kinshipA = e.target.value; render(); };
    document.getElementById("kinshipBSelect").onchange = e => { state.kinshipB = e.target.value; render(); };
  }

  const editFamilyNameBtn = document.getElementById("editFamilyNameBtn");
  if (editFamilyNameBtn) editFamilyNameBtn.onclick = () => { state.showFamilyName = true; state.err=""; render(); };

      };
    };
    const parentSelect = document.getElementById("f_parent");
    if (parentSelect) parentSelect.onchange = () => {
      grab();
      state._editForm.siblingPosition = null;
      render();
    };
    const photoInput = document.getElementById("f_photo");
    if (photoInput) photoInput.onchange = async (e) => {
      const file = e.target.files[0]; if (!file) return;
      grab();
      try { state._editForm.photos.push(await compressImage(file)); } catch(_) {}
      render();
    };
    document.querySelectorAll(".remove-photo-btn").forEach(btn => btn.onclick = () => {
      grab();
      state._editForm.photos.splice(parseInt(btn.dataset.idx), 1);
      render();
    });
    document.getElementById("saveEditBtn").onclick = async () => {
      if (state.busy) return;
      grab();
      if (!state._editForm.name.trim()){ state.err="الاسم مطلوب."; render(); return; }
      const existing = (state.editId!=="new" && !state.editId.startsWith("new-child-")) ? state.people[state.editId] : null;
      const person = {
        id: existing ? existing.id : uid(),
        name: state._editForm.name.trim(), gender: state._editForm.gender,
        gen: Math.max(1, Math.round(Number(state._editForm.gen))||1),
        parentId: state._editForm.parentId || null, motherName: state._editForm.motherName||"",
        husbandName: state._editForm.husbandName||"", wifeName: state._editForm.wifeName||"",
        birthYear: state._editForm.birthYear||"", deathYear: state._editForm.deathYear||"",
        deceased: !!(state._editForm.deceased || (state._editForm.deathYear && String(state._editForm.deathYear).trim())),
        bio: state._editForm.bio||"", photos: state._editForm.photos||[],
        photoPos: state._editForm.photoPos || "center",
        createdAt: existing?.createdAt || Date.now(),
      };
      const chosenPos = Math.max(0, parseInt(state._editForm.siblingPosition, 10) || 0);
      const siblingsList = siblingsUnder(state.people, person.parentId, person.id);
      const insertPos = Math.min(chosenPos, siblingsList.length);
      const orderedWithSelf = [...siblingsList];
      orderedWithSelf.splice(insertPos, 0, person);
      const renumbered = orderedWithSelf.map((p,i) => ({id:p.id, order:i}));
      person.order = renumbered.find(r=>r.id===person.id).order;
      state.busy = true; state.err=""; render();
      for (const r of renumbered){
        if (r.id === person.id) continue;
        const sib = state.people[r.id];
        if (sib && sib.order !== r.order){
          await savePersonCloud({...sib, order: r.order});
        }
      }
      await savePersonCloud(person);
      state.busy = false; state.editId = null; state._editForm=null; state.detailId=person.id; state.err="";
      render();
      scrollToPerson(person.id);
    };
  }

  // Pinch / pan
  const wrap = document.getElementById("canvasWrap");
  if (wrap){
    let pinch = {active:false,startDist:0,startZoom:1,midX:0,midY:0};
    let pan = {active:false,lastX:0,lastY:0,startX:0,startY:0,moved:false,velX:0,velY:0};
    let suppressClick = false;
    const dist = (a,b) => Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    const mid = (a,b) => ({x:(a.clientX+b.clientX)/2, y:(a.clientY+b.clientY)/2});
    wrap.addEventListener("touchstart", e => {
      gestureActive = true;
      if (momentumFrame){ cancelAnimationFrame(momentumFrame); momentumFrame = null; }
      if (pinchFrame){ cancelAnimationFrame(pinchFrame); pinchFrame = null; }
      if (e.touches.length===2){
        const wrapRect = wrap.getBoundingClientRect();
        const m = mid(e.touches[0],e.touches[1]);
        pinch = {active:true, startDist:dist(e.touches[0],e.touches[1]), startZoom:state.zoom,
                 midX:m.x-wrapRect.left, midY:m.y-wrapRect.top};
        pan.active=false;
      } else if (e.touches.length===1){
        pan = {active:true, lastX:e.touches[0].clientX, lastY:e.touches[0].clientY,
               startX:e.touches[0].clientX, startY:e.touches[0].clientY, moved:false};
      }
    });
    let pendingPinch = null;
    wrap.addEventListener("touchmove", e => {
      if (e.touches.length===2 && pinch.active){
        e.preventDefault();
        const wrapRect = wrap.getBoundingClientRect();
        const m = mid(e.touches[0],e.touches[1]);
        pendingPinch = { midX: m.x-wrapRect.left, midY: m.y-wrapRect.top, d: dist(e.touches[0],e.touches[1]) };
        if (!pinchFrame){
          pinchFrame = requestAnimationFrame(() => {
            pinchFrame = null;
            if (!pendingPinch || !pinch.active) return;
            const {midX, midY, d} = pendingPinch;
            const newZoom = Math.min(1.6, Math.max(0.08, pinch.startZoom*(d/pinch.startDist)));
            const oldZoom = state.zoom;
            const contentX = (wrap.scrollLeft + midX) / oldZoom;
            const contentY = (wrap.scrollTop + midY) / oldZoom;
            state.zoom = newZoom;
            const canvasEl = document.getElementById("canvas");
            const sizerEl = document.getElementById("canvasSizer");
            if (canvasEl) canvasEl.style.transform = "scale("+newZoom+")";
            if (sizerEl){ sizerEl.style.width = (layout.width*newZoom)+"px"; sizerEl.style.height = (layout.height*newZoom)+"px"; }
            wrap.scrollLeft = Math.max(0, contentX*newZoom - midX);
            wrap.scrollTop = Math.max(0, contentY*newZoom - midY);
          });
        }
      } else if (e.touches.length===1 && pan.active){
        e.preventDefault();
        const dx = e.touches[0].clientX-pan.lastX, dy = e.touches[0].clientY-pan.lastY;
        wrap.scrollLeft -= dx*PAN_SPEED; wrap.scrollTop -= dy*PAN_SPEED;
        pan.velX = dx*PAN_SPEED; pan.velY = dy*PAN_SPEED;
        pan.lastX=e.touches[0].clientX; pan.lastY=e.touches[0].clientY;
        if (Math.hypot(e.touches[0].clientX-pan.startX, e.touches[0].clientY-pan.startY) > 8) pan.moved = true;
      }
    });
    wrap.addEventListener("touchend", e => {
      if (pan.active && pan.moved) { suppressClick = true; setTimeout(()=>{suppressClick=false;}, 300); }
      if(e.touches.length<2 && pinch.active){ pinch.active=false; renderApp(); }
      if(e.touches.length<1){
        if (pan.active && pan.moved && (Math.abs(pan.velX)>2 || Math.abs(pan.velY)>2)){
          let velX = pan.velX, velY = pan.velY;
          const friction = 0.94;
          const momentumStep = () => {
            wrap.scrollLeft -= velX; wrap.scrollTop -= velY;
            velX *= friction; velY *= friction;
            if (Math.abs(velX) < 0.5 && Math.abs(velY) < 0.5){ momentumFrame = null; return; }
            momentumFrame = requestAnimationFrame(momentumStep);
          };
          momentumFrame = requestAnimationFrame(momentumStep);
        }
        pan.active=false; gestureActive=false;
      }
    });
    wrap.addEventListener("click", e => {
      if (suppressClick){ e.stopPropagation(); e.preventDefault(); suppressClick=false; }
    }, true);

    wrap.addEventListener("wheel", e => {
      e.preventDefault();
      const wrapRect = wrap.getBoundingClientRect();
      const ax = e.clientX - wrapRect.left, ay = e.clientY - wrapRect.top;
      const oldZoom = state.zoom;
      const newZoom = Math.min(1.6, Math.max(0.08, Math.round(oldZoom*(e.deltaY>0?1/1.08:1.08)*100)/100));
      const contentX = (wrap.scrollLeft + ax) / oldZoom;
      const contentY = (wrap.scrollTop + ay) / oldZoom;
      state.zoom = newZoom;
      renderApp();
      const newWrap = document.getElementById("canvasWrap");
      if (newWrap){
        newWrap.scrollLeft = Math.max(0, contentX*newZoom - ax);
        newWrap.scrollTop = Math.max(0, contentY*newZoom - ay);
      }
    }, {passive:false});
    wrap.addEventListener("mousedown", e => {
      if (e.target.closest(".node")) return;
      gestureActive = true;
      globalMouseDrag = {active:true, lastX:e.clientX, lastY:e.clientY, wrap};
      wrap.style.cursor = "grabbing";
    });
    wrap.style.cursor = "grab";
    wrap.addEventListener("click", e => {
      if (state.kinshipMode && !e.target.closest(".node")){
        state.kinshipMode = null; state.kinshipPickA = null; state.kinshipPickB = null;
        renderApp();
      }
    });

    requestAnimationFrame(() => {
      const fitKey = layout.width+"x"+layout.height;
      if (Object.keys(state.people).length>0 && state.lastFitKey === null){
        state.lastFitKey = fitKey;
        const ww = wrap.clientWidth||360, wh = wrap.clientHeight||500;
        const fit = Math.min(ww/layout.width, wh/layout.height, 1);
        state.zoom = Math.max(0.08, Math.round(fit*100)/100);
        renderApp();
      }
    });
  }
  wirePasswordToggles();
}

// ---------- Boot ----------
(async function boot(){
  updateAppIconAndManifest("شجرة العائلة");
  incrementCounter(PATH_PREFIX+"stats/totalOpens");
  if (!window.crypto || !window.crypto.subtle){ state.mode="unsupported"; render(); return; }
  try { const meta = await loadMeta(); state.familyName = meta.familyNameEnc ? "" : (meta.familyName || ""); if (state.familyName) updateAppTitle(state.familyName); } catch(_) {}
  const rec = await loadAuthRecord();
  if (rec){
    const remembered = loadRememberedSession();
    if (remembered && remembered.rawKeyB64){
      try {
        const cryptoKey = await importDataKey(remembered.rawKeyB64);
        state.session = {role: remembered.role, cryptoKey, rawKeyB64: remembered.rawKeyB64, emailIdentity: remembered.emailIdentity||null};
        state.mode = "app";
        render();
        incrementCounter(PATH_PREFIX+"stats/totalLogins");
        await loadPeople();
        startPolling();
        return;
      } catch(_) { forgetSession(); }
    }
    if (AUTO_LINK_TOKEN && AUTO_LINK_TOKEN.indexOf(".") > 0){
      try {
        const dot = AUTO_LINK_TOKEN.indexOf(".");
        const id = AUTO_LINK_TOKEN.slice(0, dot), tok = AUTO_LINK_TOKEN.slice(dot+1);
        const rec = await fbGet("linkTokens/"+id);
        if (!rec || !rec.exp || Date.now() > rec.exp) throw new Error("expired");
        const k = await deriveKey(tok, rec.salt);
        const rawKeyB64 = await decryptText(k, rec.wrap);
        fbDelete("linkTokens/"+id).catch(()=>{});
        const cryptoKey = await importDataKey(rawKeyB64);
        state.session = {role:"viewer", cryptoKey, rawKeyB64, emailIdentity: null};
        rememberSession("viewer", rawKeyB64);
        state.mode = "app";
        try {
          const clean = new URLSearchParams(window.location.search);
          clean.delete("lt");
          history.replaceState(null, "", window.location.pathname + (clean.toString() ? "?"+clean.toString() : ""));
        } catch(_) {}
        render();
        incrementCounter(PATH_PREFIX+"stats/totalLogins");
        await loadPeople();
        startPolling();
        return;
      } catch(_) { /* fall through to normal login screen */ }
    }
    if (AUTO_LOGIN_EMAIL && AUTO_LOGIN_CODE){
      try {
        await attemptEmailLogin(AUTO_LOGIN_EMAIL, AUTO_LOGIN_CODE);
        render();
        return;
      } catch(_) { /* fall through to normal login screen */ }
    }
  }
  state.mode = rec ? "login" : "setup";
  render();
})();
</script>
